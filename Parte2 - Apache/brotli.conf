<IfModule mod_brotli.c>
    BrotliCompressionQuality 5
    BrotliCompressionWindow 22
    AddOutputFilterByType BROTLI_COMPRESS text/html text/plain text/xml text/css application/javascript application/json image/svg+xml

    # Excluir binarios ya comprimidos (imágenes, video, zip)
    SetEnvIfNoCase Request_URI \.(?:gif|jpe?g|png|webp|mp4|avi|zip|gz|pdf)$ no-gzip dont-vary
</IfModule>
